services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_pm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_pm_user
      POSTGRES_PASSWORD: ai_pm_password
      POSTGRES_DB: ai_pm_tool
    ports:
      - "5433:5432"
    volumes:
      - ai_pm_postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_pm_user -d ai_pm_tool"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_pm_postgres_data:
